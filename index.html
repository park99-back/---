<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100초 거북목 탈출</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="거북목탈출">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
       /* 기존 CSS 스타일 코드들... */
</head>
<body>

    <!-- 메인 화면 -->
    <div id="main-screen">
        <h1>오늘의 3단계 루틴</h1>
        <div class="tracker">
            <div class="circle" id="circle-1"></div>
            <div class="circle" id="circle-2"></div>
            <div class="circle" id="circle-3"></div>
        </div>
        <p id="status-text">현재 0회 완료</p>
        <br><br>
        <button class="btn" onclick="startRoutine()">100초 거북목 탈출 시작</button>
    </div>

    <!-- 타이머 화면 -->
    <div id="timer-screen">
        <p id="step-info" style="color: #aaa; margin-bottom: 10px;">진행 중: 1 / 10</p>
        <div class="exercise-title" id="exercise-name">1. 투턱 만들기</div>
        <div class="exercise-desc" id="exercise-desc">정면을 보고 턱을 목 쪽으로 강하게 당겨 '투턱'을 만드세요.</div>
        
        <div class="time-left" id="timer-display">10</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- 수동 컨트롤 버튼 -->
        <div class="controls">
            <button class="control-btn btn-prev" id="prev-btn" onclick="prevExercise()">이전</button>
            <button class="control-btn btn-next" id="next-btn" onclick="nextExercise()">다음 동작</button>
        </div>
    </div>

    <script>
        const exercises = [
            { title: "1. 투턱 만들기", desc: "정면을 보고 턱을 목 쪽으로 강하게 당겨 '투턱'을 만든 후 유지합니다." },
            { title: "2. 오른쪽 목 늘리기", desc: "오른손으로 왼쪽 머리를 잡고 오른쪽으로 지그시 당겨줍니다." },
            { title: "3. 왼쪽 목 늘리기", desc: "왼손으로 오른쪽 머리를 잡고 왼쪽으로 지그시 당겨줍니다." },
            { title: "4. 목 뒤로 젖히기", desc: "양손을 깍지 껴 뒷목을 받치고, 시선은 천장을 향해 목을 젖힙니다." },
            { title: "5. 어깨 으쓱하기", desc: "양어깨를 귀에 닿을 듯 바짝 올렸다가 툭 떨어뜨리기를 반복합니다." },
            { title: "6. 가슴 활짝 펴기", desc: "양손을 등 뒤에서 깍지 끼고, 팔을 쭉 펴면서 가슴을 앞으로 내밉니다." },
            { title: "7. W자 등 조이기", desc: "양팔을 들어 'W' 모양을 만들고, 날개뼈가 닿는 느낌으로 팔꿈치를 당깁니다." },
            { title: "8. 앞으로 등 둥글게 말기", desc: "양손을 앞으로 깍지 끼고 팔을 뻗으며, 배꼽을 보며 등을 둥글게 맙니다." },
            { title: "9. 오른쪽 어깨 당기기", desc: "오른팔을 가로질러 뻗고, 왼팔로 걸어 가슴 쪽으로 지그시 당깁니다." },
            { title: "10. 왼쪽 어깨 당기기", desc: "왼팔을 가로질러 뻗고, 오른팔로 걸어 가슴 쪽으로 지그시 당깁니다." }
        ];

        let todayCount = 0;
        let currentIndex = 0;
        let timeLeft = 10;
        let timerInterval;

        function loadData() {
            const todayStr = new Date().toISOString().split('T')[0];
            const savedDate = localStorage.getItem('lastDate');
            
            if (todayStr !== savedDate) {
                localStorage.setItem('todayCount', 0);
                localStorage.setItem('lastDate', todayStr);
                todayCount = 0;
            } else {
                todayCount = parseInt(localStorage.getItem('todayCount')) || 0;
            }
            updateTrackerUI();
        }

        function updateTrackerUI() {
            for (let i = 1; i <= 3; i++) {
                const circle = document.getElementById(`circle-${i}`);
                if (i <= todayCount) {
                    circle.classList.add('done');
                } else {
                    circle.classList.remove('done');
                }
            }
            const statusText = document.getElementById('status-text');
            statusText.innerText = todayCount >= 3 ? "오늘 목표 달성! 수고하셨습니다." : `현재 ${todayCount}회 완료`;
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.connect(ctx.destination);
                osc.frequency.value = 800;
                osc.start();
                setTimeout(() => osc.stop(), 200);
            } catch (e) { console.log("오디오 재생 불가"); }
        }

        function startRoutine() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'flex';
            currentIndex = 0;
            updateExerciseScreen();
        }

        function updateExerciseScreen() {
            timeLeft = 10;
            document.getElementById('step-info').innerText = `진행 중: ${currentIndex + 1} / 10`;
            document.getElementById('exercise-name').innerText = exercises[currentIndex].title;
            document.getElementById('exercise-desc').innerText = exercises[currentIndex].desc;
            document.getElementById('timer-display').innerText = timeLeft;
            
            // 프로그레스 바 업데이트
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / exercises.length) * 100}%`;

            // 버튼 상태 업데이트 (첫 번째 동작에선 '이전' 숨기기, 마지막 동작에선 '완료'로 변경)
            document.getElementById('prev-btn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            const nextBtn = document.getElementById('next-btn');
            if (currentIndex === exercises.length - 1) {
                nextBtn.innerText = "루틴 완료";
                nextBtn.style.backgroundColor = "#2979ff";
                nextBtn.style.color = "white";
            } else {
                nextBtn.innerText = "다음 동작";
                nextBtn.style.backgroundColor = "#00e676";
                nextBtn.style.color = "#121212";
            }

            // 기존 타이머 클리어 후 재시작
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer-display').innerText = timeLeft;
                    
                    if (timeLeft === 0) {
                        playBeep(); // 0초가 되면 삐 소리가 나지만 다음으로 자동으로 넘어가진 않음
                        clearInterval(timerInterval);
                    }
                }
            }, 1000);
        }

        // 사용자가 '이전' 버튼 클릭 시
        function prevExercise() {
            if (currentIndex > 0) {
                currentIndex--;
                updateExerciseScreen();
            }
        }

        // 사용자가 '다음' 버튼 클릭 시
        function nextExercise() {
            if (currentIndex < exercises.length - 1) {
                currentIndex++;
                updateExerciseScreen();
            } else {
                finishRoutine();
            }
        }

        function finishRoutine() {
            clearInterval(timerInterval);
            alert("100초 루틴을 성공적으로 마쳤습니다!");
            if (todayCount < 3) {
                todayCount++;
                localStorage.setItem('todayCount', todayCount);
            }
            updateTrackerUI();
            document.getElementById('timer-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        }

        window.onload = loadData;
    </script>
</body>
</html>
